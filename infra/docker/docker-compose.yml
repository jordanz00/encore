# Encore local development stack.
# Usage: docker compose -f infra/docker/docker-compose.yml up -d
#
# Services:
#   postgres     - primary OLTP database (with pgvector for recommendations)
#   redis        - queue + cache (used by BullMQ worker and Better-Auth sessions)
#   minio        - S3-compatible object storage (audio, images, uploads)
#   minio-init   - one-shot bucket creation
#   meilisearch  - typo-tolerant search index
#   mailhog      - dev SMTP catcher (http://localhost:8025 to view email)
#
# Application services (api, web, worker) run via `pnpm dev` from host
# during local development for fast iteration. Production Dockerfiles for
# each app live in apps/<name>/Dockerfile.

name: encore

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: encore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore
      POSTGRES_DB: encore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encore -d encore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: encore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: encore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: encore-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/encore-uploads || true;
      mc mb -p local/encore-audio || true;
      mc mb -p local/encore-images || true;
      mc anonymous set download local/encore-audio;
      mc anonymous set download local/encore-images;
      echo 'Buckets ready.';
      "

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: encore-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: local-dev-master-key-change-me
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: encore-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:
